name: Informar un enlace roto
description: Ayúdanos a corregir una fuente que ya no abre o cambió de dirección.
title: "[Enlace] "
labels: ["enlaces", "mantenimiento"]
body:
  - type: input
    id: etapa
    attributes:
      label: Etapa y materia
      placeholder: "Ejemplo: S3 — Algoritmos"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Enlace afectado
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: Qué sucede
      description: Indica si muestra 404, exige pago, cambió de ubicación u ocurre otro problema.
    validations:
      required: true
  - type: input
    id: reemplazo
    attributes:
      label: Posible reemplazo
      description: Opcional. Debe ser legal, gratuito y preferentemente en español.
