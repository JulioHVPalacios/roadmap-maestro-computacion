name: Auditar Ruta Maestra V45

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Auditar integridad académica
        run: node scripts/audit-master-route-v45.mjs
      - name: ESLint V45
        run: npx eslint src/v45/*.tsx src/v41/AppV41.tsx
      - name: Build de producción
        run: npm run build
