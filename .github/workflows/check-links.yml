name: Revisar enlaces

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Comprobar enlaces públicos
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --timeout 20
            "README.md"
            "docs/**/*.md"
            "src/roadmap-data.ts"
            "src/mastery-data.ts"
          fail: true
