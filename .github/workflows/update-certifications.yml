name: Actualizar certificaciones y cursos

on:
  schedule:
    - cron: "35 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para auditoría visual
        run: npx playwright install --with-deps chromium

      - name: Auditar catálogo y reemplazar ofertas inactivas
        run: npm run certifications:update

      - name: Regenerar imágenes reales desde fuentes oficiales
        run: npm run certifications:covers

      - name: Guardar catálogo actualizado en el repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/certifications-v1 public/certification-covers-v1
          if git diff --cached --quiet; then
            echo "Sin cambios en certificaciones."
          else
            git commit -m "chore: actualizar certificaciones y cursos"
            git push
          fi

      - name: Construir Campus Maestro
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-build-deploy
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
